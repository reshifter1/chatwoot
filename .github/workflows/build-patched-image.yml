name: Build patched Chatwoot image (bit&pix)

# Builds the EE-identical Chatwoot image from this fork (v4.15.1 + the batch
# attachment ordering fix) and publishes it to GHCR. bit&pix pins this image by
# digest in the chatwoot-dokku wrapper. We do NOT track upstream - this runs on
# demand or when the patched files change. Edition is EE-identical to upstream
# chatwoot/chatwoot:latest: the enterprise/ folder is kept (ChatwootApp.enterprise?
# is true by folder presence) and CW_EDITION=ee is stamped as upstream does.
#
# The published package must stay PRIVATE: the image contains enterprise/ code
# under a proprietary license, so it must not be redistributed publicly. The
# Dokku box authenticates to GHCR to pull it (see chatwoot-dokku README).

on:
  push:
    branches:
      - bitandpix-4.15.1
    paths:
      # Any patched source rebuilds the image. Kept broad on purpose: this branch
      # only ever carries our own patches (we do NOT track upstream), so app/lib
      # changes here are always ours and always want a rebuild. Non-shipping paths
      # (spec/, docs) are intentionally excluded.
      - "app/**"
      - "lib/**"
      - "config/**"
      - "docker/Dockerfile"
      - ".github/workflows/build-patched-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chatwoot

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Chatwoot edition (EE-identical to upstream :latest)
        run: echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v4.15.1-bitandpix
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Pushed ${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          echo "Pin this digest in chatwoot-dokku/Dockerfile."
